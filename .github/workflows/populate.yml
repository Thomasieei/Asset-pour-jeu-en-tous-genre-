name: Populate asset bank
on:
  push:
    branches: [main]
    paths: ['.github/workflows/populate.yml', 'scripts/populate.py', 'seed/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: populate-asset-bank
  cancel-in-progress: false
jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed CC0 packs and verify every indexed file
        run: python3 scripts/populate.py
      - name: Publish assets, licenses and quality previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs catalog.json validation.json quality
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add reviewed KayKit, UI, inventory, audio and Godot VFX assets"
          git push origin HEAD:main
