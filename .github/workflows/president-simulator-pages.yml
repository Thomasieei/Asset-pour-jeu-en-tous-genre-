name: Deploy President Simulator to GitHub Pages

on:
  push:
    branches: [president-simulator-prototype]
    paths:
      - 'demos/president-simulator/**'
      - 'packs/city-kit-suburban/**'
      - '.github/workflows/president-simulator-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p site/demos/president-simulator site/packs
          cp -R demos/president-simulator/. site/demos/president-simulator/
          cp -R packs/city-kit-suburban site/packs/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
