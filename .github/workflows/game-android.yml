name: Jeu Android - Légion d'Ombre

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/game-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            game
            .github

      - name: Préparer Godot (modèles d'export)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ -d /root/.config/godot ] && [ "$HOME" != "/root" ]; then cp -r /root/.config/godot ~/.config/godot; fi
          if [ "$HOME" != "/root" ] && [ -d /root/.local/share/godot/export_templates ]; then cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/; fi
          godot --version

      - name: Importer les ressources
        working-directory: game
        run: godot --headless --path . --import 2>&1 | tee import.log || true

      - name: Test automatique (unitaires + scénario de jeu)
        working-directory: game
        run: |
          timeout 300 godot --headless --path . -- --smoke 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log import.log; then
            echo "::error::Erreurs de script détectées"; exit 1
          fi
          grep -q "SMOKE OK" smoke.log || { echo "::error::Le test de jeu a échoué"; exit 1; }

      - name: Keystore de debug
        run: keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Exporter les APK (téléphone arm64 + émulateur x86_64)
        working-directory: game
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/legion-ombre.apk 2>&1 | tee export.log
          godot --headless --path . --export-debug "AndroidEmu" build/legion-ombre-x86_64.apk 2>&1 | tee export-emu.log
          test -s build/legion-ombre.apk
          ls -lh build/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: game/build/*.apk

      - name: Publier l'APK (pré-version téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jeu-v0.1.${{ github.run_number }}
          name: "Légion d'Ombre — test ${{ github.run_number }}"
          prerelease: true
          files: game/build/legion-ombre.apk
          body: |
            APK de test Android (arm64). Télécharger `legion-ombre.apk` sur le téléphone,
            autoriser l'installation depuis cette source, puis installer.

  playtest:
    # Jeu rendu en vraie 3D (OpenGL logiciel) à la résolution d'un téléphone 2400x1080,
    # piloté par de vrais événements tactiles simulés ; captures d'écran à chaque étape.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            game
      - name: Installer Godot 4.3 et un écran virtuel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 > /dev/null
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
      - name: Importer
        working-directory: game
        run: ../godot --headless --path . --import > import.log 2>&1 || true
      - name: Partie simulée sur écran de téléphone
        working-directory: game
        run: |
          mkdir -p ../shots
          PLAYTEST_DIR=$PWD/../shots timeout 400 xvfb-run -a -s "-screen 0 2400x1080x24" \
            ../godot --rendering-driver opengl3 --audio-driver Dummy --resolution 2400x1080 --position 0,0 --path . -- --playtest 2>&1 | tee ../shots/playtest.log || true
      - name: Publier les captures sur la branche qa-captures
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b qa-captures
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "captures run ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git qa-captures

  emulator:
    # APK installé dans un vrai émulateur Android, glissements de doigt via adb, captures.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            game/tests
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android (Pixel 6, paysage)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash game/tests/emu_test.sh
      - name: Publier les captures sur la branche qa-emulateur
        if: always()
        run: |
          cd emu_shots
          git init -q && git checkout -q -b qa-emulateur
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "captures run ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git qa-emulateur
