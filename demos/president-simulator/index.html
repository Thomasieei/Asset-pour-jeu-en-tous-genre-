<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Président — Le Destin d'une Nation</title>
<meta name="theme-color" content="#101a28">
<style>
:root{--bg:#101a28;--panel:#172638eF;--panel2:#20344a;--gold:#f3c969;--mint:#70e0b1;--red:#ff7777;--text:#f5f7fb;--muted:#a8b8c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button{font:inherit;color:inherit;border:1px solid #ffffff24;background:#263c52;border-radius:12px;padding:10px 12px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button.primary{background:linear-gradient(135deg,#f3c969,#d89a3d);color:#1b2531;font-weight:800;border:0}button.active{outline:2px solid var(--gold);background:#344a60}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;position:relative}.top{z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#101a28f2;border-bottom:1px solid #ffffff17}.brand{font-weight:900;letter-spacing:.06em}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:0;font-size:10px}.stats{display:flex;gap:6px;overflow:auto}.stat{background:#203146;border:1px solid #ffffff13;border-radius:10px;padding:6px 9px;white-space:nowrap;font-size:12px}.stat b{color:var(--gold)}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}.world{position:relative;min-height:0;overflow:hidden;background:linear-gradient(#8ebbd0,#d6d5be 55%,#698d62)}.world:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#09152245,transparent 35%,#0d18252a)}.scene-title{position:absolute;z-index:2;top:12px;left:12px;text-shadow:0 2px 9px #172638;font-weight:800;font-size:17px}.scene-title small{display:block;font-weight:500;font-size:11px;color:#f1f5f8}.toast{position:absolute;z-index:5;top:72px;left:50%;transform:translateX(-50%);max-width:90%;background:#172638f5;border:1px solid #f3c96970;border-radius:14px;padding:11px 15px;box-shadow:0 10px 30px #0005;display:none}.toast.show{display:block;animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}.scene-actions{position:absolute;z-index:2;right:12px;top:12px;display:grid;gap:8px}.scene-actions button{background:#172638d9;backdrop-filter:blur(8px);font-size:12px}.bottom{z-index:4;background:#111c2bf7;border-top:1px solid #ffffff18;padding:8px 8px max(8px,env(safe-area-inset-bottom));}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 3px;background:#1b2a3c;border-color:#ffffff0e;font-size:11px}.nav .emoji{font-size:20px}.nav button.active{background:#35445a;border-color:var(--gold)}.drawer{position:absolute;z-index:6;left:8px;right:8px;bottom:82px;max-height:min(70%,560px);overflow:auto;background:#142235f7;border:1px solid #ffffff24;border-radius:20px;box-shadow:0 18px 60px #0008;backdrop-filter:blur(16px);padding:14px;display:none}.drawer.open{display:block;animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.drawer h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.action-card{min-height:98px;text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px;background:linear-gradient(145deg,#243a50,#1a2a3c);border:1px solid #ffffff15}.action-card .big{font-size:24px}.action-card strong{font-size:13px}.action-card small{color:var(--muted);line-height:1.3}.wide{grid-column:1/-1}.meter{height:7px;background:#ffffff16;border-radius:10px;overflow:hidden;margin-top:5px}.meter span{height:100%;display:block;background:linear-gradient(90deg,#70e0b1,#f3c969);border-radius:10px}.section{margin:12px 0 7px;font-weight:800;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.rowline{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff12}.rowline:last-child{border-bottom:0}.decision{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.decision button{flex:1;min-width:120px}.pill{display:inline-flex;border-radius:30px;padding:4px 8px;background:#ffffff12;color:var(--muted);font-size:11px}.footer-note{text-align:center;color:#8093a7;font-size:10px;padding-top:7px}
@media(min-width:760px){.app{grid-template-rows:auto 1fr}.top{padding:12px 20px}.bottom{position:absolute;z-index:4;left:14px;top:88px;bottom:auto;width:86px;border:1px solid #ffffff24;border-radius:18px;padding:8px;background:#111c2be8}.nav{grid-template-columns:1fr}.nav button{min-height:65px}.drawer{left:112px;right:auto;bottom:20px;width:min(440px,42vw);max-height:80%}.scene-title{top:20px;left:120px}.scene-actions{right:20px;top:20px}.stats{gap:10px}.stat{padding:8px 12px}.toast{top:90px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🏛️ PRÉSIDENCE <small>LE DESTIN D'UNE NATION · PROTOTYPE</small></div><div class="stats" id="stats"></div></header>
<main class="world"><canvas id="scene"></canvas><div class="scene-title">République de Valoria <small id="dateLabel">Jour 1 · Mandat présidentiel</small></div><div class="scene-actions"><button id="cameraBtn">🎥 Vue libre</button><button id="nextDay">⏩ Jour suivant</button></div><div class="toast" id="toast"></div><section class="drawer" id="drawer"><div class="drawer-head"><div><h2 id="drawerTitle">Bienvenue, Président</h2><div class="sub" id="drawerSub">Votre pays vous attend.</div></div><button id="closeDrawer" aria-label="Fermer">✕</button></div><div id="drawerBody"></div></section></main>
<footer class="bottom"><nav class="nav" id="nav"></nav><div class="footer-note">Prototype jouable · Sauvegarde locale automatique</div></footer>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const ASSET='https://raw.githubusercontent.com/Thomasieei/Asset-pour-jeu-en-tous-genre-/main/packs/city-kit-suburban/Models/GLB%20format/';
const state={day:1,treasury:85000000000,debt:420000000000,gdp:2860,approval:62,population:12.4,tax:22,health:65,education:61,security:68,energy:72,army:55,relations:54,unemployment:8.4,stability:70,food:74,projects:[],events:[],lastAction:'Votre mandat commence.',policies:{},troops:0};
const fmt=n=>n.toLocaleString('fr-FR',{maximumFractionDigits:1});const money=n=>n>=1e9?(n/1e9).toLocaleString('fr-FR',{maximumFractionDigits:1})+' Md €':fmt(n)+' €';
const statsEl=document.querySelector('#stats'),drawer=document.querySelector('#drawer'),body=document.querySelector('#drawerBody'),toastEl=document.querySelector('#toast');
function renderStats(){statsEl.innerHTML=[['💰',money(state.treasury)],['📊','PIB '+fmt(state.gdp)+' Md €'],['❤️',state.approval+'%'],['🛡️','Défense '+state.army]].map(([i,v])=>'<div class="stat">'+i+' <b>'+v+'</b></div>').join('');document.querySelector('#dateLabel').textContent='Jour '+state.day+' · '+(state.day<=100?'Mandat présidentiel':'Fin de mandat proche');}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),3000)}
const sections=[
{id:'overview',icon:'🏛️',label:'Pays',title:'Tableau de bord',sub:'Votre nation en un coup d’œil'},
{id:'economy',icon:'💶',label:'Économie',title:'Économie nationale',sub:'Budget, impôts, emploi et entreprises'},
{id:'people',icon:'👥',label:'Population',title:'Vie des citoyens',sub:'Santé, école, sécurité et quotidien'},
{id:'defense',icon:'🪖',label:'Défense',title:'Défense et opérations',sub:'Équipement, entraînement et déploiements'},
{id:'world',icon:'🌍',label:'Diplomatie',title:'Relations internationales',sub:'Alliances, commerce et négociations'},
{id:'build',icon:'🏗️',label:'Construction',title:'Transformer le pays',sub:'Construisez les infrastructures de demain'},
{id:'government',icon:'📜',label:'Gouvernement',title:'Gouvernement et lois',sub:'Nommez, réforme et légiférez'},
{id:'crisis',icon:'🚨',label:'Crises',title:'Cellule de crise',sub:'Décisions urgentes et événements'}
];
function card(icon,title,desc,action,wide=false){return '<button class="action-card '+(wide?'wide':'')+'" data-action="'+action+'"><span class="big">'+icon+'</span><strong>'+title+'</strong><small>'+desc+'</small></button>'}
function meter(label,val){return '<div class="rowline"><div>'+label+'<div class="meter"><span style="width:'+Math.max(0,Math.min(100,val))+'%"></span></div></div><b>'+fmt(val)+'/100</b></div>'}
function openSection(id){const s=sections.find(x=>x.id===id);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));document.querySelector('#drawerTitle').textContent=s.title;document.querySelector('#drawerSub').textContent=s.sub;drawer.classList.add('open');let h='';
if(id==='overview'){h='<div class="cards">'+card('📈','Bilan national','Indicateurs et tendances','overview')+card('🗞️','Dernières nouvelles','Les événements de votre mandat','news')+card('🧭','Objectifs du mandat','Choisissez vos priorités','goals')+card('💾','Sauvegarde','Votre partie est enregistrée automatiquement','save')+'</div><div class="section">État du pays</div>'+meter('Satisfaction citoyenne',state.approval)+meter('Santé publique',state.health)+meter('Éducation',state.education)+meter('Sécurité',state.security)+meter('Énergie',state.energy)+meter('Stabilité politique',state.stability)+'<div class="section">Dernière décision</div><p>'+state.lastAction+'</p>'}
if(id==='economy'){h='<div class="cards">'+card('🧾','Baisser les impôts','Stimule le pouvoir d’achat, réduit les recettes','taxdown')+card('🏦','Hausser les impôts','Renforce le budget, risque de mécontentement','taxup')+card('🏭','Plan industriel','Investissement de 3 Md €','industry')+card('🧑‍💼','Plan pour l’emploi','Investissement de 2 Md €','jobs')+card('⚡','Moderniser l’énergie','Investissement de 4 Md €','energy')+card('📉','Réduire la dette','Rembourser 5 Md € si possible','debt')+'</div><div class="section">Indicateurs économiques</div>'+meter('Emploi et activité',100-state.unemployment*5)+meter('Pouvoir d’achat',state.approval)+meter('Autonomie énergétique',state.energy)+'<div class="rowline"><span>Taux d’imposition</span><b>'+state.tax+'%</b></div><div class="rowline"><span>Dette publique</span><b>'+money(state.debt)+'</b></div>'}
if(id==='people'){h='<div class="cards">'+card('🏥','Plan hôpital','+ santé · coût 2 Md €','hospital')+card('🎓','École pour tous','+ éducation · coût 2 Md €','school')+card('👮','Renforcer la police','+ sécurité · coût 1,5 Md €','police')+card('🏘️','Logements abordables','+ satisfaction · coût 3 Md €','housing')+card('🥖','Aide alimentaire','+ niveau de vie · coût 1 Md €','food')+card('🌳','Plan environnement','+ santé et énergie · coût 2 Md €','green')+'</div><div class="section">Qualité de vie</div>'+meter('Santé',state.health)+meter('Éducation',state.education)+meter('Sécurité',state.security)+meter('Accès alimentaire',state.food)}
if(id==='defense'){h='<div class="cards">'+card('🪖','Former des brigades','+8 puissance · coût 2 Md €','train')+card('🚚','Acheter des véhicules','+6 puissance · coût 3 Md €','vehicles')+card('🛩️','Programme aérien','+10 puissance · coût 6 Md €','airforce')+card('🛰️','Renseignement','+ sécurité · coût 1,5 Md €','intel')+card('🛡️','Défense du territoire','Renforce les bases · coût 2 Md €','fortify')+card('🚨','Déployer une mission','Intervention fictive et conséquences','deploy')+'</div><div class="section">Forces nationales</div>'+meter('Capacité militaire',state.army)+'<div class="rowline"><span>Effectifs supplémentaires</span><b>'+fmt(state.troops)+'</b></div><p class="sub">Les opérations sont simulées dans ce prototype : leurs effets dépendent de la préparation, du budget et des relations diplomatiques.</p>'}
if(id==='world'){h='<div class="cards">'+card('🤝','Proposer une alliance','Améliore les relations, demande des concessions','alliance')+card('📦','Accord commercial','Boost économique · coût 0,5 Md €','trade')+card('🕊️','Sommet de paix','Réduit les tensions','peace')+card('🛂','Visas et frontières','Ajustez les échanges et la mobilité','visas')+card('🌐','Aide internationale','Coût 1 Md € · améliore votre image','aid')+card('📡','Négocier un traité','Traité énergétique et scientifique','treaty')+'</div><div class="section">Relations extérieures</div>'+meter('Confiance internationale',state.relations)+'<div class="rowline"><span>Position diplomatique</span><b>'+ (state.relations>70?'Très bonne':state.relations>45?'Stable':'Tendue')+'</b></div>'}
if(id==='build'){h='<div class="cards">'+card('🏥','Hôpital régional','Bâtiment visible dans la capitale · 2 Md €','buildhospital')+card('🏫','Campus national','Améliore la formation · 2,5 Md €','buildschool')+card('⚡','Centrale électrique','Renforce le réseau · 3 Md €','buildpower')+card('🛣️','Autoroute','Développe les échanges · 1,5 Md €','buildroad')+card('🏭','Zone industrielle','Crée de l’emploi · 3 Md €','buildfactory')+card('🌳','Parc national','Santé et environnement · 0,7 Md €','buildpark')+'</div><div class="section">Chantiers en cours</div>'+(state.projects.length?state.projects.map(p=>'<div class="rowline"><span>'+p.icon+' '+p.name+'</span><span class="pill">Jour '+p.finish+'</span></div>').join(''):'<p class="sub">Aucun chantier pour le moment. Les constructions terminent après quelques jours.</p>')}
if(id==='government'){h='<div class="cards">'+card('👔','Remanier le cabinet','Choisissez vos priorités ministérielles','cabinet')+card('📜','Réforme administrative','Réduit les lenteurs, coûte 1 Md €','reform')+card('⚖️','Réforme judiciaire','Renforce la confiance publique','justice')+card('🗳️','Lancer une consultation','Écoutez les citoyens','consult')+card('📰','Conférence de presse','Expliquez votre programme','press')+card('📋','Loi sur la transparence','Renforce la stabilité politique','transparency')+'</div><div class="section">Administration</div>'+meter('Stabilité politique',state.stability)+'<div class="rowline"><span>Mandat</span><b>Jour '+state.day+' / 100</b></div>'}
if(id==='crisis'){h='<div class="cards">'+card('🌪️','Catastrophe naturelle','Préparez les secours · coût 1 Md €','disaster')+card('📉','Crise économique','Soutien aux ménages · coût 2 Md €','recession')+card('🚧','Grève nationale','Négociez avec les syndicats','strike')+card('🔐','Cyberattaque','Sécurisez les services publics','cyber')+card('🦠','Alerte sanitaire','Protégez les hôpitaux et la population','healthcrisis')+card('🚨','Conseil de sécurité','Évaluez les risques nationaux','securitycouncil')+'</div><div class="section">Événements récents</div>'+(state.events.slice(-5).reverse().map(e=>'<div class="rowline"><span>'+e.icon+' '+e.text+'</span><span class="pill">J'+e.day+'</span></div>').join('')||'<p class="sub">Aucune crise en cours. Profitez-en pour préparer le pays.</p>')}
body.innerHTML=h;body.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action))); }
const actions={
taxdown:()=>{state.tax=Math.max(10,state.tax-2);state.treasury-=1200000000;state.approval+=4;state.gdp+=12;return 'Vous baissez les impôts. Le pouvoir d’achat progresse, mais les recettes diminuent.'},
taxup:()=>{state.tax=Math.min(45,state.tax+2);state.treasury+=2500000000;state.approval-=5;state.stability-=2;return 'Vous augmentez les impôts. Le budget respire, mais la mesure est impopulaire.'},
industry:()=>{cost(3000000000);state.gdp+=18;state.unemployment=Math.max(2,state.unemployment-.5);return 'Le plan industriel est lancé. De nouveaux emplois devraient apparaître.'},
jobs:()=>{cost(2000000000);state.unemployment=Math.max(2,state.unemployment-1);state.approval+=3;return 'Votre plan pour l’emploi est lancé.'},
energy:()=>{cost(4000000000);state.energy+=9;state.gdp+=8;return 'Le réseau énergétique est modernisé.'},
debt:()=>{if(state.treasury<5000000000)throw Error('Le Trésor ne dispose pas de 5 Md €.');state.treasury-=5000000000;state.debt-=5000000000;return '5 Md € de dette ont été remboursés.'},
hospital:()=>{cost(2000000000);state.health+=10;state.approval+=2;return 'Les hôpitaux reçoivent des moyens supplémentaires.'},
school:()=>{cost(2000000000);state.education+=10;state.approval+=2;return 'Le plan scolaire est lancé.'},
police:()=>{cost(1500000000);state.security+=8;state.approval+=1;return 'Des moyens supplémentaires sont attribués à la sécurité.'},
housing:()=>{cost(3000000000);state.approval+=7;state.health+=2;return 'Le programme de logements abordables est lancé.'},
food:()=>{cost(1000000000);state.food+=10;state.approval+=3;return 'Les aides alimentaires sont distribuées.'},
green:()=>{cost(2000000000);state.health+=3;state.energy+=3;return 'Le plan environnemental améliore la qualité de vie.'},
train:()=>{cost(2000000000);state.army+=8;state.troops+=2500;return '2 500 militaires rejoignent les brigades entraînées.'},
vehicles:()=>{cost(3000000000);state.army+=6;return 'Les véhicules sont commandés et les capacités logistiques progressent.'},
airforce:()=>{cost(6000000000);state.army+=10;return 'Le programme aérien est financé.'},
intel:()=>{cost(1500000000);state.security+=5;state.stability+=2;return 'Les services de renseignement reçoivent de nouveaux moyens.'},
fortify:()=>{cost(2000000000);state.army+=3;state.security+=3;return 'Les défenses territoriales sont renforcées.'},
deploy:()=>{if(state.army<45)throw Error('Votre armée est trop faible pour cette mission.');state.treasury-=800000000;state.army-=2;state.relations-=5;state.events.push({day:state.day,icon:'🚨',text:'Mission extérieure déployée'});return 'Mission déployée. La logistique coûte cher et les relations se tendent. Vous pourrez en suivre les résultats dans les événements.'},
alliance:()=>{state.relations+=10;state.stability+=2;return 'Un partenaire accepte d’ouvrir des négociations d’alliance.'},
trade:()=>{cost(500000000);state.gdp+=25;state.relations+=4;return 'Un nouvel accord commercial ouvre des débouchés.'},
peace:()=>{state.relations+=8;state.army=Math.min(100,state.army+1);return 'Le sommet de paix réduit les tensions régionales.'},
visas:()=>{state.relations+=3;state.approval+=1;return 'Une réforme équilibrée des visas facilite les échanges.'},
aid:()=>{cost(1000000000);state.relations+=7;state.approval+=1;return 'Votre aide internationale améliore la réputation du pays.'},
treaty:()=>{state.relations+=5;state.energy+=3;return 'Un traité de coopération scientifique et énergétique est signé.'},
buildhospital:()=>build('Hôpital régional','🏥',2000000000,3,()=>{state.health+=8;state.approval+=2}),
buildschool:()=>build('Campus national','🏫',2500000000,4,()=>{state.education+=8;state.gdp+=6}),
buildpower:()=>build('Centrale électrique','⚡',3000000000,5,()=>{state.energy+=12;state.gdp+=10}),
buildroad:()=>build('Autoroute','🛣️',1500000000,3,()=>{state.gdp+=12;state.unemployment=Math.max(2,state.unemployment-.3)}),
buildfactory:()=>build('Zone industrielle','🏭',3000000000,5,()=>{state.gdp+=20;state.unemployment=Math.max(2,state.unemployment-.8)}),
buildpark:()=>build('Parc national','🌳',700000000,2,()=>{state.health+=4;state.approval+=2}),
cabinet:()=>{state.stability+=5;state.approval+=1;return 'Vous remaniez le cabinet. Une équipe resserrée reçoit des objectifs mesurables.'},
reform:()=>{cost(1000000000);state.stability+=7;state.gdp+=5;return 'La réforme administrative réduit les délais de décision.'},
justice:()=>{state.stability+=4;state.approval+=2;return 'La réforme judiciaire renforce la confiance dans les institutions.'},
consult:()=>{state.approval+=4;state.stability+=1;return 'La consultation nationale fait remonter les priorités des citoyens.'},
press:()=>{state.approval+=2;return 'Votre conférence de presse clarifie les priorités du gouvernement.'},
transparency:()=>{state.stability+=6;state.relations+=2;return 'La loi sur la transparence est adoptée.'},
disaster:()=>{cost(1000000000);state.health+=2;state.stability+=2;state.events.push({day:state.day,icon:'🌪️',text:'Secours mobilisés après la catastrophe'});return 'Les secours sont mobilisés et les infrastructures essentielles sécurisées.'},
recession:()=>{cost(2000000000);state.approval+=2;state.gdp+=5;return 'Le plan de soutien amortit la crise économique.'},
strike:()=>{state.treasury-=500000000;state.approval+=2;state.stability+=2;return 'Le gouvernement ouvre des négociations avec les syndicats.'},
cyber:()=>{cost(700000000);state.security+=5;state.stability+=2;return 'Les services essentiels sont protégés par une cellule cyber.'},
healthcrisis:()=>{cost(1000000000);state.health+=6;state.approval+=1;return 'Les hôpitaux passent en alerte et les stocks sont renforcés.'},
securitycouncil:()=>{state.security+=2;state.stability+=2;return 'Le conseil de sécurité actualise les risques et le plan de prévention.'},
overview:()=>{openSection('overview');return 'Voici le bilan national.'},
news:()=>{openSection('crisis');return 'Le journal national est ouvert.'},
goals:()=>{body.innerHTML='<div class="section">Choisissez une priorité</div><div class="cards">'+card('💶','Croissance','Booster le PIB','goalEconomy')+card('❤️','Bien-être','Améliorer la vie quotidienne','goalPeople')+card('🛡️','Sécurité','Renforcer la défense','goalDefense')+card('🌍','Influence','Rayonner à l’international','goalWorld')+'</div>';body.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));return 'Choisissez votre cap présidentiel.'},
goalEconomy:()=>{state.policies.goal='Croissance';state.gdp+=4;return 'Votre priorité est désormais la croissance.'},
goalPeople:()=>{state.policies.goal='Bien-être';state.approval+=2;return 'Votre priorité est désormais le bien-être.'},
goalDefense:()=>{state.policies.goal='Sécurité';state.army+=2;return 'Votre priorité est désormais la sécurité.'},

function cost(n){if(state.treasury<n)throw Error('Le Trésor ne dispose pas des fonds nécessaires. Essayez une autre décision.');state.treasury-=n}

function clamp(n){return Math.max(0,Math.min(100,n))}
function nextDay(){state.day++;const income=650000000;state.treasury+=income-(state.tax<20?350000000:state.tax>28?150000000:0);state.debt+=120000000;state.gdp+=state.approval>50?.7:-.5;state.approval+=(state.health+state.education+state.security)/300-0.65;state.approval=clamp(state.approval);state.projects=state.projects.filter(p=>{if(p.finish<=state.day){p.complete?.();state.events.push({day:state.day,icon:p.icon,text:p.name+' est terminé'});toast(p.name+' est terminé !');return false}return true});if(state.day%7===0){const ev=[{icon:'📈',text:'La production nationale progresse'},{icon:'🗞️',text:'Le débat public se concentre sur le pouvoir d’achat'},{icon:'🤝',text:'Un partenaire propose une rencontre diplomatique'},{icon:'🌧️',text:'Des intempéries perturbent certaines routes'}][Math.floor(Math.random()*4)];state.events.push({day:state.day,...ev});if(state.policies.goal==='Croissance')state.gdp+=2;if(state.policies.goal==='Bien-être')state.approval=clamp(state.approval+1);if(state.policies.goal==='Sécurité')state.security=clamp(state.security+1);if(state.policies.goal==='Influence')state.relations=clamp(state.relations+1)}state.events=state.events.slice(-25);state.lastAction='Journée terminée. Les indicateurs évoluent selon vos décisions.';renderStats();save();if(drawer.classList.contains('open'))openSection(document.querySelector('.nav button.active')?.dataset.id||'overview');toast('Jour '+state.day+' : le pays a avancé.')}
